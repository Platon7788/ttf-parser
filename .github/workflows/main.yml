name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  bounded-fuzz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Three coverage-guided font targets with ASan
        run: bash testing-tools/ttf-fuzz/run-bounded.sh 120
      - name: Preserve evolved corpora, logs and crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bounded-font-fuzz
          path: |
            target/bounded-fuzz/corpus
            target/bounded-fuzz/artifacts
            target/bounded-fuzz/*.log
          retention-days: 14
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ['1.99.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            c-api -> target
            benches -> target
            testing-tools/ttf-fuzz -> target
      - name: Format all packages
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path c-api/Cargo.toml
          cargo fmt --check --manifest-path benches/Cargo.toml
          cargo fmt --check --manifest-path testing-tools/ttf-fuzz/Cargo.toml
          cargo fmt --check --manifest-path testing-tools/downstream-smoke/Cargo.toml
      - name: Strict parser lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Parser tests in both profiles
        run: |
          cargo test --all-features
          cargo test --example font2svg
          cargo test --release --all-features
          cargo test --no-default-features --features std
      - name: Feature contracts including no_std
        run: |
          cargo clippy --lib --no-default-features --features no-std-float -- -D warnings
          cargo clippy --lib --no-default-features --features std -- -D warnings
          cargo clippy --lib --no-default-features --features alloc,no-std-float,variable-fonts,gvar-alloc -- -D warnings
          cargo clippy --lib --no-default-features --features variable-fonts,no-std-float -- -D warnings
          cargo check --all-features
      - name: C API tests and lint
        working-directory: c-api
        run: |
          cargo test --all-features
          cargo test --release --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo build --release
          cargo check --no-default-features
      - name: Native C ABI and ASan (Linux)
        if: runner.os == 'Linux'
        working-directory: c-api
        run: |
          gcc test.c -o target/release/c-smoke -Ltarget/release -lttfparser -Werror -fsanitize=address
          LD_LIBRARY_PATH=target/release target/release/c-smoke
      - name: Native C ABI (Windows)
        if: runner.os == 'Windows'
        working-directory: c-api
        run: |
          clang test.c target/release/ttfparser.dll.lib -o target/release/c-smoke.exe -Werror
          ./target/release/c-smoke.exe
      - name: Existing font consumers
        run: cargo test --manifest-path testing-tools/downstream-smoke/Cargo.toml
      - name: Benchmark package
        run: cargo bench --manifest-path benches/Cargo.toml --no-run
      - name: Compile libFuzzer harnesses (no tool installation)
        run: cargo check --release --manifest-path testing-tools/ttf-fuzz/Cargo.toml --all-targets
