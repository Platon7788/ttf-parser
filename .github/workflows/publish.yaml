name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.26.0)"
        required: true
        type: string

concurrency:
  # Key on the resolved tag rather than github.ref: a release event and a workflow_dispatch
  # rerun for the SAME tag carry different refs and would otherwise race, while two unrelated
  # manual dispatches share refs/heads/main and would cancel each other.
  # Never cancel a publish mid-flight — cargo publish is irreversible.
  group: publish-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by crates-io-auth-action: it exchanges a GitHub OIDC token for a short-lived
  # crates.io token, so no long-lived CARGO_REGISTRY_TOKEN secret exists in this repo.
  # crates.io must have this repo configured as a Trusted Publisher for the exchange to work.
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag and version
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a tag to publish"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

          echo "Tag: $tag"
          echo "Version: ${tag#v}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      # A tag that disagrees with the manifest would publish the wrong version under the
      # right name, which cannot be undone — crates.io does not allow re-uploading a version.
      - name: Verify the manifest version matches the tag
        run: |
          set -euo pipefail
          target="${{ steps.meta.outputs.version }}"
          manifest="$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)"
          if [ "$manifest" != "$target" ]; then
            echo "::error::Cargo.toml is $manifest but the tag says $target"
            exit 1
          fi
          echo "Manifest and tag agree: $target"

      - name: Skip if this version is already on crates.io
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          exists=false
          if curl -fsS -A "ttf-parser-publish-workflow" \
              "https://crates.io/api/v1/crates/ttf-parser/${version}" >/dev/null; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Already published? $exists"

      - name: Install toolchain
        if: steps.published.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      # A last gate before an irreversible upload. The full feature matrix runs in the Rust
      # workflow; this is the cheap confirmation that the exact tagged tree is sound.
      - name: Run tests
        if: steps.published.outputs.exists != 'true'
        run: cargo test

      - name: Authenticate to crates.io
        if: steps.published.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Only the root crate is published. `c-api` is a cdylib distributed via cargo-c and has
      # never been on crates.io; `benches` and `testing-tools` are not published either.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
